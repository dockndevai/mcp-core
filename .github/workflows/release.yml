name: Release

# Publishes the library to npm on a version tag, or on a manual run from the Actions tab.
#
# This is a LIBRARY, not an MCP server — there is no server.json and no MCP-registry step.
#
# Tag release:
#   npm version patch            # bumps package.json + creates the vX.Y.Z tag
#   git push --follow-tags
#
# Manual run (Actions tab → Release → Run workflow):
#   dry_run = true  → build + validate, npm publish --dry-run (nothing published)
#   dry_run = false → real publish of the current package.json version
#
# Requires the NPM_TOKEN repo secret (an npm automation token with publish rights to
# the @dockndevai scope). The tag (vX.Y.Z) must match package.json "version".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and validate but do NOT publish"
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Verify tag matches version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          echo "package.json=$PKG  ref=$GITHUB_REF_NAME ($GITHUB_REF_TYPE)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then echo "::error::tag v$TAG does not match version $PKG"; exit 1; fi
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Publish to npm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — validating the package without publishing."
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
